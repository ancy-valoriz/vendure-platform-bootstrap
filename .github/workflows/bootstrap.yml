name: Deploy Vendure Platform

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      RAILWAY_TOKEN: ${{ vars.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      SUPERADMIN_USERNAME: ${{ vars.SUPERADMIN_USERNAME }}
      SUPERADMIN_PASSWORD: ${{ vars.SUPERADMIN_PASSWORD }}
      APP_ENV: ${{ vars.APP_ENV }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      NEXT_PUBLIC_VENDURE_TOKEN: ${{ vars.NEXT_PUBLIC_VENDURE_TOKEN }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run bootstrap
        run: bash scripts/bootstrap.sh